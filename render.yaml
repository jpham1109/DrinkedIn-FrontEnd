# Render Blueprint for the Kinpour frontend (formerly DrinkedIn — see
# ai/deployment-plan.md's rebrand section; this infra pass only renames
# the production resource, it does not touch in-app branding/copy/assets).
#
# Static Sites on Render are free with no spin-down, so no plan decision
# is needed here (unlike the backend's web/worker services). No region
# field either — Render's global CDN, not pinned to a single region.
#
# REACT_APP_BACKEND_URL is a CRA build-time variable — it gets baked into
# the compiled JS bundle, not read at request time. It must be set to the
# backend Web Service's real Render URL BEFORE this Blueprint's build
# runs; if the backend hasn't been deployed yet, deploy it first, copy
# its URL, then set the value below (or in the dashboard) and
# build/deploy this Static Site. Once kinpour.com is live as a custom
# domain, this moves to the final production URL — see
# ai/deployment-plan.md's deploy-order/cookie-domain-transition sections.
#
# Best-effort Blueprint written against Render's documented syntax —
# validate in the dashboard's "New Blueprint" flow before relying on it.
# See ai/deployment-plan.md (Phase5-DrinkedIn root) for full setup steps.

services:
  - type: web
    name: kinpour-web
    runtime: static
    buildCommand: npm ci && npm run build # npm ci, not npm install — installs
      # exactly what's in package-lock.json (fails loudly on a
      # lockfile/package.json mismatch instead of silently re-resolving),
      # the standard reproducible-build choice. No project-specific
      # install flags exist to preserve (confirmed: no .npmrc in this repo).
    staticPublishPath: ./build
    pullRequestPreviewsEnabled: false
    envVars:
      - key: REACT_APP_BACKEND_URL
        value: '' # fill in with the deployed backend's exact URL, e.g.
        # https://kinpour-api.onrender.com (or https://api.kinpour.com
        # once that custom domain is live) — no trailing slash
      - key: NODE_VERSION
        value: '22.23.5' # Render's version-selection precedence (verified
        # against Render's own docs) is: this dashboard/Blueprint
        # NODE_VERSION env var first, then .node-version, then .nvmrc,
        # then package.json's engines field — this is the line that
        # actually governs Render's build, kept in sync with .nvmrc
        # (which exists for local nvm-based development, not consumed by
        # Render directly while this env var is set). A supported Node 22
        # LTS point release — verified, not assumed: clean `npm ci` +
        # `CI=true npm run build` + eslint + test suite all pass under
        # this exact version, including the native Tailwind oxide
        # binding that requires Node >=20 (see package.json's `engines`).
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
        # Belt-and-suspenders with public/_redirects — Render Blueprints
        # support both mechanisms; kept in sync intentionally rather than
        # relying on just one in case either is deprecated later.
